<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">Roman Khadka</title>
  <desc id="description">An editorial systems diagram introducing Roman Khadka, a software engineer who makes complex systems feel calm.</desc>

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121815"/>
      <stop offset="0.55" stop-color="#101512"/>
      <stop offset="1" stop-color="#0b100d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ebe7dd" stroke-width="0.7" opacity="0.08"/>
    </pattern>
    <pattern id="micro-grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#ebe7dd" stroke-width="0.35" opacity="0.06"/>
    </pattern>
    <pattern id="speckle" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="7" r="0.45" fill="#ebe7dd" opacity="0.12"/>
      <circle cx="17" cy="3" r="0.35" fill="#ebe7dd" opacity="0.09"/>
      <circle cx="11" cy="19" r="0.4" fill="#ebe7dd" opacity="0.11"/>
      <circle cx="22" cy="14" r="0.3" fill="#ebe7dd" opacity="0.08"/>
    </pattern>
    <clipPath id="frame">
      <rect x="20" y="20" width="1160" height="420" rx="2"/>
    </clipPath>
  </defs>

  <rect width="1200" height="460" fill="url(#night)"/>
  <g clip-path="url(#frame)">
    <rect x="20" y="20" width="1160" height="420" fill="url(#grid)"/>
    <path d="M 724 -40 L 1235 198 L 1235 510 L 935 510 Z" fill="#17342f" opacity="0.64"/>
    <path d="M 842 -40 L 1235 142 L 1235 510 L 1080 510 Z" fill="url(#micro-grid)" opacity="0.95"/>
    <rect width="1200" height="460" fill="url(#speckle)" opacity="0.64"/>
  </g>

  <rect x="20.5" y="20.5" width="1159" height="419" rx="2" fill="none" stroke="#ebe7dd" stroke-width="1" opacity="0.82"/>
  <path d="M 44 54 H 240 M 960 54 H 1156" fill="none" stroke="#ebe7dd" stroke-width="1" opacity="0.8"/>
  <circle cx="252" cy="54" r="3.5" fill="#ff7657"/>
  <circle cx="948" cy="54" r="3.5" fill="#65b6ab"/>

  <g fill="#ebe7dd">
    <text x="46" y="59" font-family="'Courier New', monospace" font-size="12" letter-spacing="2.6">RK / ENGINEERING</text>
    <text x="1154" y="59" text-anchor="end" font-family="'Courier New', monospace" font-size="12" letter-spacing="2.2">UTAH · 40.7° N</text>
  </g>

  <g transform="translate(66 109)">
    <text x="0" y="0" fill="#9ca69f" font-family="'Courier New', monospace" font-size="11" letter-spacing="3.5">SOFTWARE ENGINEER · PAYMENTS · TOOLMAKER</text>
    <text x="0" y="83" fill="#ebe7dd" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="78" letter-spacing="-2">Roman</text>
    <text x="0" y="160" fill="#ebe7dd" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="78" font-style="italic" letter-spacing="-2">Khadka</text>
    <path d="M 2 184 H 526" fill="none" stroke="#ebe7dd" stroke-width="1" opacity="0.85"/>
    <path d="M 2 190 H 396" fill="none" stroke="#ff7657" stroke-width="4"/>
    <text x="0" y="224" fill="#a8b0aa" font-family="'Courier New', monospace" font-size="11.5" letter-spacing="1.9">PAYMENT SYSTEMS · COMMERCE INFRASTRUCTURE · DEVELOPER TOOLS</text>
  </g>

  <g transform="translate(885 224)">
    <circle r="113" fill="#111815" stroke="#ebe7dd" stroke-width="1.2"/>
    <circle r="84" fill="none" stroke="#65b6ab" stroke-width="1" stroke-dasharray="2 8"/>
    <circle r="47" fill="#ebe7dd"/>
    <path d="M 0 -47 A 47 47 0 0 1 0 47 L 0 -47 Z" fill="#ff7657"/>
    <circle r="8" fill="#111815"/>
  </g>

  <g fill="none" stroke="#ebe7dd" stroke-width="1" opacity="0.9">
    <path d="M 753 132 L 802 164"/>
    <path d="M 1015 111 L 974 144"/>
    <path d="M 1022 308 L 982 279"/>
    <path d="M 750 325 L 799 291"/>
  </g>
  <g fill="#ebe7dd">
    <circle cx="753" cy="132" r="4"/>
    <circle cx="1015" cy="111" r="4"/>
    <circle cx="1022" cy="308" r="4"/>
    <circle cx="750" cy="325" r="4"/>
  </g>
  <g fill="#a8b0aa" font-family="'Courier New', monospace" font-size="10" letter-spacing="1.8">
    <text x="744" y="118" text-anchor="end">PAYMENTS</text>
    <text x="1026" y="97">COMMERCE</text>
    <text x="1033" y="327">TOOLS</text>
    <text x="740" y="344" text-anchor="end">SYSTEMS</text>
  </g>

  <g transform="translate(66 404)">
    <text fill="#ebe7dd" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="3.2">MAKE THE COMPLEX FEEL CALM.</text>
    <text x="1088" fill="#9ca69f" text-anchor="end" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">EST. 2016 / GITHUB</text>
  </g>
</svg>
