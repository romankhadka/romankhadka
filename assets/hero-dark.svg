<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d">
  <title id="t">Roman Khadka</title>
  <desc id="d">Roman Khadka: software engineer working on payment systems, commerce infrastructure, and developer tools.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121815"/>
      <stop offset="0.55" stop-color="#101512"/>
      <stop offset="1" stop-color="#0b100d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ebe7dd" stroke-width="0.7" opacity="0.07"/>
    </pattern>
    <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#ebe7dd" stroke-width="0.35" opacity="0.05"/>
    </pattern>
    <pattern id="speckle" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="7" r="0.45" fill="#ebe7dd" opacity="0.12"/>
      <circle cx="17" cy="3" r="0.35" fill="#ebe7dd" opacity="0.09"/>
      <circle cx="11" cy="19" r="0.4" fill="#ebe7dd" opacity="0.11"/>
      <circle cx="22" cy="14" r="0.3" fill="#ebe7dd" opacity="0.08"/>
    </pattern>
    <clipPath id="frame"><rect x="16" y="16" width="968" height="268" rx="2"/></clipPath>
  </defs>

  <rect width="1000" height="300" fill="url(#paper)"/>
  <g clip-path="url(#frame)">
    <rect x="16" y="16" width="968" height="268" fill="url(#grid)"/>
    <path d="M 636 -40 L 1040 122 L 1040 340 L 800 340 Z" fill="#17342f" opacity="0.62"/>
    <path d="M 742 -40 L 1040 80 L 1040 340 L 930 340 Z" fill="url(#micro)" opacity="0.9"/>
    <rect width="1000" height="300" fill="url(#speckle)" opacity="0.55"/>
  </g>
  <rect x="16.5" y="16.5" width="967" height="267" rx="2" fill="none" stroke="#ebe7dd" stroke-width="1" opacity="0.55"/>

  <text x="44" y="53" fill="#ebe7dd" font-family="'Courier New',monospace" font-size="14" letter-spacing="2.6">RK / ENGINEERING</text>
  <path d="M 238 48 H 316" fill="none" stroke="#ebe7dd" stroke-width="1" opacity="0.7"/>
  <circle cx="328" cy="48" r="3.5" fill="#ff7657"/>
  <text x="958" y="53" fill="#9ca69f" text-anchor="end" font-family="'Courier New',monospace" font-size="14" letter-spacing="2">UTAH · 40.7° N</text>

  <g transform="translate(52 108)">
    <text x="0" y="0" fill="#9ca69f" font-family="'Courier New',monospace" font-size="15" letter-spacing="3">PAYMENTS · COMMERCE · TOOLS</text>
    <text x="-2" y="86" fill="#ebe7dd" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="92" letter-spacing="-2.5">Roman <tspan font-style="italic">Khadka</tspan></text>
    <path d="M 0 112 H 560" fill="none" stroke="#ebe7dd" stroke-width="1" opacity="0.8"/>
    <path d="M 0 119 H 372" fill="none" stroke="#ff7657" stroke-width="5"/>
    <text x="0" y="152" fill="#a8b0aa" font-family="'Courier New',monospace" font-size="17" letter-spacing="0.6">Make the complex feel calm.</text>
  </g>

  <g transform="translate(838 152)">
    <circle r="92" fill="#0b100d" stroke="#ebe7dd" stroke-width="1.4"/>
    <circle r="66" fill="none" stroke="#65b6ab" stroke-width="1.2" stroke-dasharray="2 9"/>
    <circle r="42" fill="#ebe7dd"/>
    <path d="M 0 -42 A 42 42 0 0 1 0 42 Z" fill="#ff7657"/>
    <circle r="7" fill="#0b100d"/>
  </g>
