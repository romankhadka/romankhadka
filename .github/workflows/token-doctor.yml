name: Token doctor (temporary)

# Diagnoses what STATS_TOKEN can actually see. Prints no secret material:
# only scope names, counts, and booleans. Delete once the token works.

on:
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose
        env:
          T: ${{ secrets.STATS_TOKEN }}
        run: |
          set -uo pipefail

          echo "=== 1. Token class and scopes (from REST headers) ==="
          # Classic PATs and OAuth tokens report X-OAuth-Scopes. Fine-grained
          # PATs do not send that header at all, which is the tell.
          H=$(curl -sS -D - -o /dev/null -H "Authorization: token $T" https://api.github.com/user)
          echo "$H" | grep -iE '^HTTP/|^x-oauth-scopes:|^x-accepted-oauth-scopes:|^x-github-sso:' || true
          if echo "$H" | grep -qi '^x-oauth-scopes:'; then
            echo "  -> classic PAT or OAuth token"
          else
            echo "  -> NO x-oauth-scopes header: this is a FINE-GRAINED token"
          fi

          echo
          echo "=== 2. Who is the token? ==="
          curl -sS -H "Authorization: bearer $T" -H "Content-Type: application/json" \
            -d '{"query":"{viewer{login}}"}' https://api.github.com/graphql

          echo
          echo "=== 3. Can it see private repos at all? ==="
          curl -sS -H "Authorization: bearer $T" -H "Content-Type: application/json" \
            -d '{"query":"{viewer{repositories(privacy:PRIVATE){totalCount}}}"}' https://api.github.com/graphql

          echo
          echo "=== 4. viewer{} contributions for 2026 ==="
          curl -sS -H "Authorization: bearer $T" -H "Content-Type: application/json" \
            -d '{"query":"{viewer{contributionsCollection(from:\"2026-01-01T00:00:00Z\",to:\"2026-07-30T23:59:59Z\"){totalPullRequestContributions totalCommitContributions restrictedContributionsCount}}}"}' \
            https://api.github.com/graphql

          echo
          echo "=== 5. user(login:) contributions for 2026 (what the build script uses) ==="
          curl -sS -H "Authorization: bearer $T" -H "Content-Type: application/json" \
            -d '{"query":"{user(login:\"romankhadka\"){contributionsCollection(from:\"2026-01-01T00:00:00Z\",to:\"2026-07-30T23:59:59Z\"){totalPullRequestContributions totalCommitContributions restrictedContributionsCount}}}"}' \
            https://api.github.com/graphql

          echo
          echo "=== 6. Can it see a known private org repo? ==="
          curl -sS -o /dev/null -w '  fluid-commerce/fluid -> HTTP %{http_code}\n' \
            -H "Authorization: token $T" https://api.github.com/repos/fluid-commerce/fluid
